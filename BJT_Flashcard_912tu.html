<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BJT Flashcard — 912 từ vựng</title>
<style>
:root {
  --bg: #0f172a;
  --card-bg: #1e293b;
  --card-front: #f8fafc;
  --accent-j5: #22d3ee;
  --accent-j4: #34d399;
  --accent-j3: #fbbf24;
  --accent-j2: #fb923c;
  --accent-j1: #f472b6;
  --text: #e2e8f0;
  --text-dim: #94a3b8;
  --shadow: rgba(0,0,0,0.4);
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

/* HEADER */
.header {
  text-align: center;
  padding: 24px 16px 8px;
}
.header h1 {
  font-size: 1.6rem;
  font-weight: 700;
  background: linear-gradient(135deg, #22d3ee, #f472b6);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.header .subtitle {
  color: var(--text-dim);
  font-size: 0.85rem;
  margin-top: 4px;
}

/* CONTROLS */
.controls {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px;
  padding: 12px 16px;
  max-width: 700px;
  margin: 0 auto;
}
.level-btn {
  padding: 6px 16px;
  border: 2px solid;
  border-radius: 20px;
  background: transparent;
  font-size: 0.85rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
}
.level-btn.active {
  color: var(--bg) !important;
}
.level-btn[data-level="J5"] { border-color: var(--accent-j5); color: var(--accent-j5); }
.level-btn[data-level="J5"].active { background: var(--accent-j5); }
.level-btn[data-level="J4"] { border-color: var(--accent-j4); color: var(--accent-j4); }
.level-btn[data-level="J4"].active { background: var(--accent-j4); }
.level-btn[data-level="J3"] { border-color: var(--accent-j3); color: var(--accent-j3); }
.level-btn[data-level="J3"].active { background: var(--accent-j3); }
.level-btn[data-level="J2"] { border-color: var(--accent-j2); color: var(--accent-j2); }
.level-btn[data-level="J2"].active { background: var(--accent-j2); }
.level-btn[data-level="J1"] { border-color: var(--accent-j1); color: var(--accent-j1); }
.level-btn[data-level="J1"].active { background: var(--accent-j1); }
.level-btn[data-level="ALL"] { border-color: #818cf8; color: #818cf8; }
.level-btn[data-level="ALL"].active { background: #818cf8; }

/* ACTION BTNS ROW */
.action-row {
  display: flex;
  justify-content: center;
  gap: 8px;
  padding: 4px 16px 8px;
  flex-wrap: wrap;
}
.action-btn {
  padding: 5px 14px;
  border: 1.5px solid #475569;
  border-radius: 16px;
  background: transparent;
  color: #94a3b8;
  font-size: 0.78rem;
  cursor: pointer;
  transition: all 0.2s;
}
.action-btn:hover { border-color: #818cf8; color: #c7d2fe; }
.action-btn.active-filter { border-color: #f472b6; color: #f472b6; }

/* PROGRESS */
.progress-bar {
  max-width: 500px;
  margin: 0 auto 8px;
  padding: 0 24px;
}
.progress-track {
  height: 4px;
  background: #334155;
  border-radius: 2px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  border-radius: 2px;
  transition: width 0.3s;
}
.progress-text {
  display: flex;
  justify-content: space-between;
  font-size: 0.75rem;
  color: var(--text-dim);
  margin-top: 4px;
}

/* CARD AREA */
.card-container {
  perspective: 1200px;
  max-width: 520px;
  margin: 12px auto;
  padding: 0 20px;
  height: 320px;
}
.card {
  width: 100%;
  height: 100%;
  position: relative;
  transform-style: preserve-3d;
  transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
  cursor: pointer;
}
.card.flipped {
  transform: rotateY(180deg);
}
.card-face {
  position: absolute;
  width: 100%;
  height: 100%;
  backface-visibility: hidden;
  border-radius: 20px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* FRONT */
.card-front {
  background: var(--card-bg);
  border: 1px solid #334155;
  align-items: center;
  justify-content: center;
  box-shadow: 0 8px 32px var(--shadow);
}
.card-front .level-tag {
  position: absolute;
  top: 16px;
  left: 16px;
  font-size: 0.7rem;
  font-weight: 700;
  padding: 3px 10px;
  border-radius: 10px;
  letter-spacing: 0.5px;
}
.card-front .topic-tag {
  position: absolute;
  top: 16px;
  right: 16px;
  font-size: 0.7rem;
  color: var(--text-dim);
  background: #0f172a;
  padding: 3px 10px;
  border-radius: 10px;
}
.card-front .kanji {
  font-size: 4rem;
  font-weight: 700;
  color: var(--card-front);
  line-height: 1.2;
  text-align: center;
  padding: 0 20px;
}
.card-front .hint {
  position: absolute;
  bottom: 16px;
  font-size: 0.75rem;
  color: #475569;
}

/* BACK */
.card-back {
  background: var(--card-bg);
  border: 1px solid #334155;
  transform: rotateY(180deg);
  padding: 24px;
  box-shadow: 0 8px 32px var(--shadow);
}
.card-back .back-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 12px;
}
.card-back .back-kanji {
  font-size: 1.8rem;
  font-weight: 700;
  color: var(--card-front);
}
.card-back .back-reading {
  font-size: 1.1rem;
  color: #818cf8;
  margin-bottom: 4px;
}
.card-back .back-meaning {
  font-size: 1.3rem;
  font-weight: 600;
  margin-bottom: 16px;
  padding-bottom: 12px;
  border-bottom: 1px solid #334155;
}
.card-back .example-label {
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text-dim);
  margin-bottom: 6px;
}
.card-back .example-jp {
  font-size: 1rem;
  line-height: 1.6;
  color: var(--card-front);
  margin-bottom: 4px;
}
.card-back .example-kana {
  font-size: 0.85rem;
  color: #818cf8;
  margin-bottom: 6px;
}
.card-back .example-vi {
  font-size: 0.85rem;
  color: var(--text-dim);
  font-style: italic;
}
.card-back .mark-known {
  position: absolute;
  bottom: 16px;
  right: 20px;
  padding: 5px 14px;
  border-radius: 14px;
  border: 1.5px solid #475569;
  background: transparent;
  color: #94a3b8;
  font-size: 0.78rem;
  cursor: pointer;
  transition: all 0.2s;
}
.card-back .mark-known:hover { border-color: #34d399; color: #34d399; }
.card-back .mark-known.known { border-color: #34d399; background: #34d399; color: #0f172a; }

/* NAV */
.nav-row {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 20px;
  padding: 16px;
}
.nav-btn {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  border: 2px solid #475569;
  background: transparent;
  color: var(--text);
  font-size: 1.2rem;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
}
.nav-btn:hover { border-color: #818cf8; color: #c7d2fe; }
.nav-btn:disabled { opacity: 0.3; cursor: default; }

/* KEYBOARD HINT */
.kb-hint {
  text-align: center;
  font-size: 0.72rem;
  color: #475569;
  padding-bottom: 20px;
}
.kb-hint kbd {
  background: #1e293b;
  border: 1px solid #334155;
  border-radius: 4px;
  padding: 1px 6px;
  font-family: inherit;
  font-size: 0.72rem;
}

/* STATS BAR */
.stats-bar {
  display: flex;
  justify-content: center;
  gap: 24px;
  padding: 8px 16px;
  font-size: 0.8rem;
}
.stat { color: var(--text-dim); }
.stat b { color: var(--text); }

/* RESPONSIVE */
@media (max-width: 540px) {
  .card-container { height: 300px; }
  .card-front .kanji { font-size: 3rem; }
  .card-back { padding: 18px; }
  .card-back .back-kanji { font-size: 1.5rem; }
  .card-back .back-meaning { font-size: 1.1rem; }
}
</style>
</head>
<body>

<div class="header">
  <h1>BJT Flashcard</h1>
  <div class="subtitle">912 từ vựng kinh doanh tiếng Nhật — J5 → J1</div>
</div>

<div class="controls" id="levelBtns"></div>
<div class="action-row">
  <button class="action-btn" id="shuffleBtn" onclick="shuffleDeck()">🔀 Trộn bài</button>
  <button class="action-btn" id="unknownOnly" onclick="toggleUnknownFilter()">📖 Chỉ chưa thuộc</button>
  <button class="action-btn" onclick="resetKnown()">↩ Reset đã thuộc</button>
</div>

<div class="stats-bar">
  <span class="stat">Tổng: <b id="statTotal">0</b></span>
  <span class="stat">Đã thuộc: <b id="statKnown" style="color:#34d399">0</b></span>
  <span class="stat">Còn lại: <b id="statRemain" style="color:#fbbf24">0</b></span>
</div>

<div class="progress-bar">
  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  <div class="progress-text">
    <span id="progressIdx">0 / 0</span>
    <span id="progressPct">0%</span>
  </div>
</div>

<div class="card-container" id="cardContainer">
  <div class="card" id="card" onclick="flipCard()">
    <div class="card-face card-front" id="cardFront">
      <span class="level-tag" id="frontLevel">J5</span>
      <span class="topic-tag" id="frontTopic"></span>
      <div class="kanji" id="frontKanji">会社</div>
      <span class="hint">Nhấn để lật thẻ</span>
    </div>
    <div class="card-face card-back" id="cardBack">
      <div class="back-top">
        <div>
          <div class="back-kanji" id="backKanji">会社</div>
          <div class="back-reading" id="backReading">かいしゃ</div>
        </div>
        <span class="level-tag" id="backLevel" style="position:static">J5</span>
      </div>
      <div class="back-meaning" id="backMeaning">công ty</div>
      <div class="example-label">Ví dụ</div>
      <div class="example-jp" id="exJp"></div>
      <div class="example-kana" id="exKana"></div>
      <div class="example-vi" id="exVi"></div>
      <button class="mark-known" id="markBtn" onclick="event.stopPropagation(); toggleKnown()">✓ Đã thuộc</button>
    </div>
  </div>
</div>

<div class="nav-row">
  <button class="nav-btn" id="prevBtn" onclick="prev()">◀</button>
  <button class="nav-btn" onclick="flipCard()" style="font-size:0.8rem">FLIP</button>
  <button class="nav-btn" id="nextBtn" onclick="next()">▶</button>
</div>

<div class="kb-hint">
  <kbd>←</kbd> Trước &nbsp; <kbd>Space</kbd> Lật &nbsp; <kbd>→</kbd> Sau &nbsp; <kbd>K</kbd> Đánh dấu thuộc
</div>

<script src="vocab_912.js"></script>
<script>


const COLORS = { J5:'#22d3ee', J4:'#34d399', J3:'#fbbf24', J2:'#fb923c', J1:'#f472b6' };
const LEVELS = ['J5','J4','J3','J2','J1'];

let currentLevel = 'ALL';
let deck = [];
let idx = 0;
let flipped = false;
let unknownFilter = false;
let known = {};

// Load saved known from memory
try {
  const s = window._bjt_known;
  if (s) known = s;
} catch(e) {}

function saveMem() { window._bjt_known = known; }

function buildDeck() {
  let words = [];
  const levels = currentLevel === 'ALL' ? LEVELS : [currentLevel];
  levels.forEach(lv => {
    (VOCAB[lv]||[]).forEach((w,i) => {
      const id = lv+'_'+i;
      if (unknownFilter && known[id]) return;
      words.push({...w, level:lv, id});
    });
  });
  deck = words;
  idx = 0;
  flipped = false;
  render();
}

function shuffleDeck() {
  for (let i = deck.length-1; i > 0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [deck[i], deck[j]] = [deck[j], deck[i]];
  }
  idx = 0;
  flipped = false;
  render();
}

function toggleUnknownFilter() {
  unknownFilter = !unknownFilter;
  document.getElementById('unknownOnly').classList.toggle('active-filter', unknownFilter);
  buildDeck();
}

function resetKnown() {
  if (!confirm('Reset tất cả đánh dấu "Đã thuộc"?')) return;
  known = {};
  saveMem();
  buildDeck();
}

function flipCard() {
  if (deck.length === 0) return;
  flipped = !flipped;
  document.getElementById('card').classList.toggle('flipped', flipped);
}

function prev() {
  if (idx <= 0) return;
  idx--;
  flipped = false;
  render();
}

function next() {
  if (idx >= deck.length-1) return;
  idx++;
  flipped = false;
  render();
}

function toggleKnown() {
  if (deck.length === 0) return;
  const w = deck[idx];
  if (known[w.id]) delete known[w.id];
  else known[w.id] = true;
  saveMem();
  renderCard();
  updateStats();
}

function render() {
  document.getElementById('card').classList.remove('flipped');
  flipped = false;
  renderCard();
  updateStats();
  updateProgress();
  document.getElementById('prevBtn').disabled = idx <= 0;
  document.getElementById('nextBtn').disabled = idx >= deck.length-1;
}

function renderCard() {
  if (deck.length === 0) {
    document.getElementById('frontKanji').textContent = unknownFilter ? '✨ Đã thuộc hết!' : 'Không có từ';
    document.getElementById('frontLevel').style.display = 'none';
    document.getElementById('frontTopic').style.display = 'none';
    return;
  }
  const w = deck[idx];
  const c = COLORS[w.level];
  // Front
  document.getElementById('frontKanji').textContent = w.k;
  const fl = document.getElementById('frontLevel');
  fl.textContent = w.level;
  fl.style.background = c;
  fl.style.color = '#0f172a';
  fl.style.display = '';
  const ft = document.getElementById('frontTopic');
  ft.textContent = w.t;
  ft.style.display = '';
  // Back
  document.getElementById('backKanji').textContent = w.k;
  document.getElementById('backReading').textContent = w.r;
  const bl = document.getElementById('backLevel');
  bl.textContent = w.level;
  bl.style.background = c;
  bl.style.color = '#0f172a';
  bl.style.padding = '3px 10px';
  bl.style.borderRadius = '10px';
  bl.style.fontSize = '0.7rem';
  bl.style.fontWeight = '700';
  document.getElementById('backMeaning').textContent = w.m;
  document.getElementById('backMeaning').style.color = c;
  document.getElementById('exJp').textContent = w.ek;
  document.getElementById('exKana').textContent = w.er;
  document.getElementById('exVi').textContent = w.ev;
  // Known button
  const mb = document.getElementById('markBtn');
  if (known[w.id]) {
    mb.classList.add('known');
    mb.textContent = '✓ Đã thuộc';
  } else {
    mb.classList.remove('known');
    mb.textContent = '✓ Đánh dấu thuộc';
  }
}

function updateStats() {
  const levels = currentLevel === 'ALL' ? LEVELS : [currentLevel];
  let total = 0, kn = 0;
  levels.forEach(lv => {
    const len = (VOCAB[lv]||[]).length;
    total += len;
    (VOCAB[lv]||[]).forEach((_,i) => { if (known[lv+'_'+i]) kn++; });
  });
  document.getElementById('statTotal').textContent = total;
  document.getElementById('statKnown').textContent = kn;
  document.getElementById('statRemain').textContent = total - kn;
}

function updateProgress() {
  const n = deck.length;
  const pct = n > 0 ? ((idx+1)/n*100) : 0;
  const c = currentLevel === 'ALL' ? '#818cf8' : COLORS[currentLevel] || '#818cf8';
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressFill').style.background = c;
  document.getElementById('progressIdx').textContent = n > 0 ? (idx+1) + ' / ' + n : '0 / 0';
  document.getElementById('progressPct').textContent = Math.round(pct) + '%';
}

// Level buttons
function initLevelBtns() {
  const ctr = document.getElementById('levelBtns');
  const all = ['ALL',...LEVELS];
  all.forEach(lv => {
    const b = document.createElement('button');
    b.className = 'level-btn' + (lv===currentLevel?' active':'');
    b.dataset.level = lv;
    const count = lv==='ALL' ? Object.values(VOCAB).reduce((s,a)=>s+a.length,0) : (VOCAB[lv]||[]).length;
    b.textContent = (lv==='ALL'?'Tất cả':lv) + ' (' + count + ')';
    b.onclick = () => {
      currentLevel = lv;
      document.querySelectorAll('.level-btn').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      buildDeck();
    };
    ctr.appendChild(b);
  });
}

// Keyboard
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') prev();
  else if (e.key === 'ArrowRight') next();
  else if (e.key === ' ') { e.preventDefault(); flipCard(); }
  else if (e.key === 'k' || e.key === 'K') toggleKnown();
});

// Touch swipe
let touchStartX = 0;
document.getElementById('cardContainer').addEventListener('touchstart', e => {
  touchStartX = e.touches[0].clientX;
});
document.getElementById('cardContainer').addEventListener('touchend', e => {
  const diff = e.changedTouches[0].clientX - touchStartX;
  if (Math.abs(diff) > 50) {
    if (diff > 0) prev();
    else next();
  }
});

// Init
initLevelBtns();
buildDeck();
</script>
</body>
</html>
